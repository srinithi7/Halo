name: halo
description: "HALO - an anonymous community recognition app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.5
  firebase_auth: ^4.17.5
  cupertino_icons: ^1.0.6
  lucide_icons_flutter: ^3.0.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  http: ^1.6.0
  google_fonts: ^6.2.1
  flutter_contacts: ^1.1.9+2
  permission_handler: ^11.3.1
  emoji_picker_flutter: ^2.2.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
